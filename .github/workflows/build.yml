name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Validate syntax
        run: python -m py_compile app_4.py
      - name: Build
        run: pyinstaller --noconfirm --clean --windowed --name TubeSlice app_4.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TubeSlice/* -DestinationPath TubeSlice-Windows-x64.zip
      - name: Package Unix
        if: runner.os != 'Windows'
        run: tar -czf TubeSlice-${{ runner.os }}.tar.gz -C dist TubeSlice
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubeSlice-${{ runner.os }}
          path: |
            dist/TubeSlice*
            TubeSlice-*.zip
            TubeSlice-*.tar.gz
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TubeSlice-*.zip
            TubeSlice-*.tar.gz
