name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Validate syntax
        run: python -m py_compile app_4.py
      - name: Build
        run: pyinstaller --noconfirm --clean --windowed --name TubeSlice app_4.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path TubeSlice-Windows-x64.zip) {
            Remove-Item TubeSlice-Windows-x64.zip -Force
          }
          Compress-Archive -Path dist/TubeSlice/* -DestinationPath TubeSlice-Windows-x64.zip
      - name: Package Unix
        if: runner.os != 'Windows'
        run: tar -czf TubeSlice-${{ runner.os }}.tar.gz -C dist TubeSlice
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubeSlice-${{ runner.os }}
          path: |
            dist/TubeSlice*
            TubeSlice-*.zip
            TubeSlice-*.tar.gz
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/TubeSlice-*.zip
            release-assets/TubeSlice-*.tar.gz
